services:
  postgis:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: grdf_qc_db
    environment:
      POSTGRES_DB: grdf_qc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/sql
volumes:
  pgdata: